<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetGate - Sifre Degistir</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1e3a5f,#0f1c2e); }
    .box { background:#fff; padding:40px; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.4); width:380px; }
    .logo { text-align:center; margin-bottom:8px; font-size:24px; font-weight:700; color:#1e3a5f; }
    .sub { text-align:center; color:#8a97a8; font-size:13px; margin-bottom:22px; }
    .warn { background:#fef3e0; color:#b26a00; padding:11px; border-radius:8px; font-size:13px; margin-bottom:18px; text-align:center; }
    label { display:block; font-size:13px; color:#5a6b7f; margin:14px 0 6px; }
    input { width:100%; padding:12px; border:1px solid #d5dde6; border-radius:8px; font-size:14px; }
    input:focus { outline:none; border-color:#2b6cb0; }
    button { width:100%; margin-top:22px; padding:12px; background:#2b6cb0; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
    button:hover { background:#245a94; }
    .err { background:#fde8e8; color:#c0392b; padding:10px; border-radius:8px; font-size:13px; margin-bottom:16px; text-align:center; }
    .back { display:block; text-align:center; margin-top:16px; font-size:13px; color:#8a97a8; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Sifre Degistir</div>
    <div class="sub">{{ user }} hesabi icin yeni sifre belirleyin</div>
    {% if forced %}<div class="warn">Guvenlik icin varsayilan sifreyi degistirmelisiniz.</div>{% endif %}
    {% if msg and msg[0] == "err" %}<div class="err">{{ msg[1] }}</div>{% endif %}
    <form method="post" action="/change-password">
      <label>Yeni Sifre</label>
      <input type="password" name="new_password" autofocus required>
      <label>Yeni Sifre (Tekrar)</label>
      <input type="password" name="new_password2" required>
      <button type="submit">Kaydet</button>
    </form>
    {% if not forced %}<a class="back" href="/">Panele don</a>{% endif %}
  </div>
</body>
</html>
